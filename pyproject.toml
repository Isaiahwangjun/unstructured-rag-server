[project]
name = "unstructured-rag-server"
version = "0.1.0"
description = "Remote MCP server that exposes unstructured-rag-kit chunks.json over a streamable-HTTP MCP endpoint, backed by OpenAI embeddings + Chroma."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaiah Wang" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12",
    "chromadb>=0.5",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
rag-ingest = "rag_server.ingest:main"
rag-server = "rag_server.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_server"]
